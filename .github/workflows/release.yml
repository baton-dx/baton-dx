name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run ci:version
          publish: bun run ci:publish
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: release
    if: steps.changesets.outputs.published == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get published version
        id: version
        run: |
          VERSION=$(jq -r '.version' packages/cli/package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download tarball and compute SHA256
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARBALL_URL="https://registry.npmjs.org/@baton-dx/cli/-/cli-${VERSION}.tgz"
          for i in $(seq 1 10); do
            curl -fsSL "${TARBALL_URL}" -o cli.tgz && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          SHA256=$(shasum -a 256 cli.tgz | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Update Formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          sed -i "s|url \"https://registry.npmjs.org/@baton-dx/cli/-/cli-.*\.tgz\"|url \"https://registry.npmjs.org/@baton-dx/cli/-/cli-${VERSION}.tgz\"|" Formula/baton-dx.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/baton-dx.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/baton-dx.rb
          git diff --cached --quiet || (git commit -m "chore: bump homebrew formula to ${VERSION}" && git push origin main)
